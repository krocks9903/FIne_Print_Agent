name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Offline provider: no API keys, no network calls to a model.
      MODEL_PROVIDER: mock
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `npm test` passes a glob to `node --test`, which needs Node 21+.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build packages and run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
